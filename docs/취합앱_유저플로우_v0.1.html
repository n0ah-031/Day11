<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>취합앱 유저 플로우</title>
<style>
:root {
  /* design-systems/airbnb/tokens.css — pasted verbatim per token contract */
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-warm: #f7f7f7;
  --fg: #222222;
  --fg-2: #3f3f3f;
  --muted: #6a6a6a;
  --meta: #929292;
  --border: #dddddd;
  --border-soft: #ebebeb;
  --accent: #ff385c;
  --accent-on: #ffffff;
  --accent-hover: #e31c5f;
  --accent-active: #e00b41;
  --success: #008a05;
  --warn: #c47700;
  --danger: #c13515;
  --font-display:
    "Airbnb Cereal VF", "Airbnb Cereal App", Circular,
    -apple-system, system-ui, "Helvetica Neue", Roboto, sans-serif;
  --font-body:
    "Airbnb Cereal VF", "Airbnb Cereal App", Circular,
    -apple-system, system-ui, "Helvetica Neue", Roboto, sans-serif;
  --font-mono:
    ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco,
    Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 20px;
  --text-xl: 22px;
  --text-2xl: 28px;
  --text-3xl: 44px;
  --text-4xl: 56px;
  --leading-body: 1.43;
  --leading-tight: 1.2;
  --tracking-display: -0.02em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --section-y-desktop: 64px;
  --section-y-tablet: 48px;
  --section-y-phone: 32px;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised:
    rgba(0, 0, 0, 0.02) 0 0 0 1px,
    rgba(0, 0, 0, 0.04) 0 2px 6px 0,
    rgba(0, 0, 0, 0.1) 0 4px 8px 0;
  --focus-ring: 0 0 0 2px var(--fg);
  --motion-fast: 150ms;
  --motion-base: 200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --container-max: 1280px;
  --container-gutter-desktop: 40px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
}

* { box-sizing:border-box; margin:0; }
html, body { background:var(--bg); }
body{
  font-family:var(--font-body);
  color:var(--fg);
  font-size:var(--text-sm);
  font-weight:500;
  line-height:var(--leading-body);
  -webkit-font-smoothing:antialiased;
}
.page{
  max-width:1760px;
  margin:0 auto;
  min-height:100svh;
  display:grid;
  grid-template-rows:auto 1fr;
  gap:clamp(14px,2.2vh,26px);
  padding:clamp(20px,3vh,36px) var(--container-gutter-desktop);
}

/* ---------- header ---------- */
.top{ display:flex; justify-content:space-between; align-items:center; gap:32px; flex-wrap:wrap; }
h1{
  font-family:var(--font-display);
  font-size:var(--text-2xl);
  font-weight:700;
  line-height:var(--leading-tight);
  letter-spacing:var(--tracking-display);
}
.sub{ margin-top:6px; font-size:var(--text-sm); font-weight:500; color:var(--muted); }
.top-right{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.chip{
  display:flex; align-items:center; gap:14px;
  border:1px solid var(--border); border-radius:var(--radius-pill);
  padding:9px 18px; font-size:var(--text-sm); white-space:nowrap;
}
.chip b{ font-size:var(--text-base); font-weight:700; letter-spacing:-0.01em; }
.cnt{ display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-weight:500; }
.cd{ width:9px; height:9px; border-radius:50%; flex:none; }
.cd.pass{ background:var(--success); }
.cd.partial{ background:var(--warn); }
.cd.fail{ background:var(--danger); }
.btn{
  font-family:var(--font-body); font-size:var(--text-sm); font-weight:500;
  border-radius:var(--radius-pill); padding:10px 18px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface); color:var(--fg);
  transition:background var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
}
.btn:hover{ background:var(--surface-warm); }
.btn:active{ transform:scale(0.96); }
.btn:focus-visible{ outline:none; box-shadow:var(--focus-ring); }
.btn-primary{
  background:var(--accent); border-color:var(--accent); color:var(--accent-on);
  border-radius:var(--radius-sm); font-size:var(--text-base); padding:12px 22px;
}
.btn-primary:hover{ background:var(--accent-hover); }
.btn-primary:active{ transform:scale(0.92); background:var(--accent-active); }

/* ---------- process mini-flow ---------- */
.process{ display:flex; align-items:center; gap:clamp(12px,1.6vw,24px); flex-wrap:wrap; }
.p-node{ display:flex; align-items:center; gap:10px; }
.p-dot{
  flex:none; width:32px; height:32px; border-radius:50%;
  background:var(--fg); color:var(--bg);
  display:grid; place-items:center;
  font-size:var(--text-sm); font-weight:700;
}
.p-text b{ display:block; font-size:var(--text-base); font-weight:600; letter-spacing:-0.01em; line-height:var(--leading-tight); }
.p-text span{ font-size:var(--text-xs); font-weight:500; color:var(--muted); }
.p-link{
  width:clamp(24px,3vw,56px); height:2px; border-radius:2px;
  background:color-mix(in srgb, var(--fg) 22%, var(--surface));
}

/* ---------- flowchart board ---------- */
.board{ display:flex; flex-direction:column; justify-content:center; gap:clamp(14px,2.2vh,24px); min-height:0; min-width:0; overflow-x:auto; }
.board-caption{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; }
.board-caption h2{
  font-family:var(--font-display);
  font-size:var(--text-lg); font-weight:700; letter-spacing:-0.01em;
}
.caption-note{ font-size:var(--text-sm); font-weight:500; color:var(--muted); }

.flow{
  --node-w:clamp(164px, 10.5vw, 186px);
  --col-gap:clamp(20px, 1.5vw, 26px);
  --row-gap:20px;
  --line-c:color-mix(in srgb, var(--fg) 26%, var(--surface));
  position:relative;
  display:flex; align-items:center; gap:var(--col-gap);
  width:fit-content; max-width:100%; margin:0 auto;
  padding:8px 4px;
}
.flow-col{ display:flex; flex-direction:column; gap:var(--row-gap); position:relative; z-index:1; }
.flow-edges{ position:absolute; left:0; top:0; width:100%; height:100%; z-index:0; pointer-events:none; overflow:visible; }
.flow-edges .edge{ fill:none; stroke:var(--line-c); stroke-width:2.5; }
.flow-edges .edge-head{ fill:var(--line-c); }

.box{
  background:var(--surface);
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  display:flex; flex-direction:column; gap:8px;
  width:var(--node-w); min-width:0;
  cursor:pointer;
  transition:border-color var(--motion-base) var(--ease-standard);
}
.st-pass .box{ border-color:color-mix(in srgb, var(--success) 55%, var(--surface)); }
.st-partial .box{ border-color:color-mix(in srgb, var(--warn) 60%, var(--surface)); }
.st-fail .box{ border-color:color-mix(in srgb, var(--danger) 50%, var(--surface)); }
.box:focus-visible{ outline:none; box-shadow:var(--focus-ring); }
.s-caret{ width:12px; height:12px; color:var(--meta); flex:none; margin-left:2px; transition:transform var(--motion-base) var(--ease-standard); }
.box.open .s-caret{ transform:rotate(180deg); }
.ops-panel{ display:none; border-top:1px solid var(--border-soft); padding-top:10px; margin-top:4px; cursor:auto; }
.box.open .ops-panel{ display:block; animation:ops-in var(--motion-base) var(--ease-standard); }
@keyframes ops-in{ from{ opacity:0; translate:0 -4px; } to{ opacity:1; translate:0 0; } }
.box-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
.box-top .s-tag{ margin-right:auto; }
.s-tag{ font-size:var(--text-xs); font-weight:600; letter-spacing:0.08em; color:var(--meta); text-transform:uppercase; white-space:nowrap; }
.pill{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-body); font-size:var(--text-xs); font-weight:600; letter-spacing:0.02em;
  white-space:nowrap; border:none; cursor:pointer;
  border-radius:var(--radius-pill); padding:7px 11px;
  transition:transform var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
}
.pill:hover{ transform:scale(1.04); }
.pill:active{ transform:scale(0.94); }
.pill:focus-visible{ outline:none; box-shadow:var(--focus-ring); }
.pill i{ width:8px; height:8px; border-radius:50%; flex:none; }
.st-untested .pill{ background:var(--surface-warm); color:var(--muted); }
.st-untested .pill i{ background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--meta); }
.st-pass .pill{ background:color-mix(in srgb, var(--success) 12%, var(--surface)); color:var(--fg); }
.st-pass .pill i{ background:var(--success); }
.st-partial .pill{ background:color-mix(in srgb, var(--warn) 14%, var(--surface)); color:var(--fg); }
.st-partial .pill i{ background:var(--warn); }
.st-fail .pill{ background:color-mix(in srgb, var(--danger) 12%, var(--surface)); color:var(--fg); }
.st-fail .pill i{ background:var(--danger); }
.s-name{
  font-size:var(--text-base); font-weight:600; letter-spacing:-0.01em; line-height:var(--leading-tight);
  padding:2px 6px; margin-left:-6px; border-radius:var(--radius-sm);
}
.s-note{
  font-size:var(--text-sm); font-weight:500; color:var(--muted);
  line-height:var(--leading-body); min-height:20px;
  padding:2px 6px; margin-left:-6px; border-radius:var(--radius-sm);
}
.s-note:empty::before{ content:attr(data-ph); color:var(--meta); }

/* ---------- background operations ---------- */
.ops{ display:flex; flex-direction:column; }
.ops-head{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
.ops-label{ font-size:var(--text-xs); font-weight:600; letter-spacing:0.02em; color:var(--meta); }
.ops-add{
  flex:none; width:22px; height:22px; padding:0;
  border:1px solid var(--border); background:var(--surface); color:var(--muted);
  border-radius:var(--radius-sm); cursor:pointer; font-size:14px; line-height:1;
  display:grid; place-items:center;
  transition:background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.ops-add:hover{ background:var(--surface-warm); color:var(--fg); }
.ops-add:focus-visible{ outline:none; box-shadow:var(--focus-ring); }
.ops-list{ list-style:none; padding:0; margin:6px 0 0; display:flex; flex-direction:column; gap:6px; }
.op{ display:flex; align-items:flex-start; gap:7px; }
.op-check{
  flex:none; width:20px; height:20px; padding:0;
  border-radius:50%; border:1.5px solid var(--border); background:var(--surface);
  cursor:pointer; display:grid; place-items:center;
  font-size:10px; font-weight:700; line-height:1; color:var(--bg);
  transition:background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
}
.op-check:hover{ transform:scale(1.1); }
.op-check:focus-visible{ outline:none; box-shadow:var(--focus-ring); }
.op[data-st="pass"] .op-check{ background:var(--success); border-color:var(--success); }
.op[data-st="pass"] .op-check::after{ content:"✓"; }
.op[data-st="fail"] .op-check{ background:var(--danger); border-color:var(--danger); }
.op[data-st="fail"] .op-check::after{ content:"✕"; font-size:9px; }
.op-text{
  flex:1; min-width:0; font-size:var(--text-xs); font-weight:500; color:var(--fg-2);
  line-height:1.5; padding:1px 7px; border-radius:4px; border:1px solid transparent;
}
.op[data-st="pass"] .op-text{
  background:color-mix(in srgb, var(--success) 9%, var(--surface));
  border-color:color-mix(in srgb, var(--success) 42%, var(--surface));
}
.op[data-st="fail"] .op-text{
  background:color-mix(in srgb, var(--danger) 8%, var(--surface));
  border-color:color-mix(in srgb, var(--danger) 40%, var(--surface));
}
.op-text:empty::before{ content:"동작 내용을 입력"; color:var(--meta); }
.op-del{
  flex:none; width:18px; height:18px; padding:0;
  border:none; background:transparent; color:var(--meta);
  border-radius:4px; cursor:pointer; font-size:14px; line-height:1;
  display:grid; place-items:center; opacity:0;
  transition:opacity var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
}
.op:hover .op-del, .op:focus-within .op-del{ opacity:1; }
.op-del:hover{ color:var(--danger); background:color-mix(in srgb, var(--danger) 10%, var(--surface)); }
.op-del:focus-visible{ outline:none; box-shadow:var(--focus-ring); opacity:1; }

[contenteditable]{ cursor:text; }
[contenteditable]:focus{ outline:2px solid var(--fg); outline-offset:1px; background:var(--surface-warm); }

/* ---------- legend strip ---------- */
.legend-strip{
  display:flex; justify-content:space-between; align-items:center; gap:16px 32px; flex-wrap:wrap;
  background:var(--surface-warm); border-radius:var(--radius-md); padding:12px 20px;
}
.legend{ display:flex; align-items:center; gap:clamp(16px,2vw,32px); list-style:none; padding:0; flex-wrap:wrap; }
.legend li{ display:flex; align-items:center; gap:8px; }
.l-dot{ width:14px; height:14px; border-radius:50%; flex:none; }
.l-dot.untested{ background:var(--surface); box-shadow:inset 0 0 0 2px var(--border); }
.l-dot.pass{ background:var(--success); }
.l-dot.partial{ background:var(--warn); }
.l-dot.fail{ background:var(--danger); }
.legend b{ font-size:var(--text-sm); font-weight:600; }
.legend em{ font-style:normal; font-size:var(--text-sm); font-weight:500; color:var(--muted); }
.hint{ font-size:var(--text-sm); font-weight:500; color:var(--muted); }

@media (max-width:1000px){
  .page{ grid-template-rows:none; }
  .flow{ margin:0; align-items:flex-start; }
}

@media print{
  @page{ size:A4 landscape; margin:9mm; }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .page{ min-height:0; max-width:none; padding:0; gap:10px; }
  .actions,.hint{ display:none; }
  .flow{ --node-w:148px; --col-gap:18px; --row-gap:10px; padding:2px 0; }
  h1{ font-size:20px; }
  .sub{ font-size:10px; margin-top:2px; }
  .chip{ padding:5px 12px; gap:10px; }
  .chip b{ font-size:12px; }
  .cnt{ font-size:10px; }
  .p-dot{ width:22px; height:22px; font-size:11px; }
  .p-text b{ font-size:12px; }
  .p-text span{ font-size:9px; }
  .board{ gap:10px; overflow:visible; }
  .board-caption h2{ font-size:14px; }
  .caption-note{ font-size:9px; }
  .box{ padding:9px 11px; gap:4px; }
  .s-tag{ font-size:8px; }
  .pill{ font-size:8px; padding:3px 7px; gap:4px; }
  .pill i{ width:6px; height:6px; }
  .s-name{ font-size:12px; padding:0 3px; margin-left:-3px; }
  .s-note{ font-size:9px; line-height:1.35; min-height:0; padding:0 3px; margin-left:-3px; }
  .ops-panel,.s-caret{ display:none; }
  .flow-edges .edge{ stroke-width:2; }
  .legend-strip{ padding:7px 14px; border-radius:10px; }
  .legend b,.legend em{ font-size:9px; }
  .l-dot{ width:10px; height:10px; }
}
</style>
</head>
<body>
<div class="page" data-od-id="page">

  <header class="top" data-od-id="header">
    <div class="title-block">
      <h1>취합앱 유저 플로우</h1>
      <p class="sub">로그인부터 결과 다운로드까지 — 사용자가 하는 동작과, 그 뒤에서 돌아가는 처리입니다.</p>
    </div>
    <div class="actions">
      <button class="btn" id="exportBtn" data-od-id="export-btn" type="button">HTML로 저장 · 공유</button>
    </div>
  </header>

  <section class="board" aria-label="유저 플로우 플로우차트">
    <div class="board-caption">
      <h2 data-od-id="flow-title">자료 취합 전용 프로그램 — 사용자 동작 흐름</h2>
      <p class="caption-note">기준 — PRD v1.9 · 핸드오프(2026-08-04). 상자를 클릭하면 그 단계 뒤에서 돌아가는 세부 동작이 보입니다. 이름 · 근거 · 판정은 클릭해서 고칠 수 있습니다.</p>
    </div>
    <div class="flow" data-od-id="flowchart" id="flow" role="list" aria-label="유저 플로우 단계들"></div>
  </section>

</div>

<script>
(function(){
  "use strict";

    { id:"s1", name:"로그인 · 홈 진입", tip:"사번으로 로그인해 '생성'/'취합' 중 원하는 작업까지 도달하는지", state:"pass", note:"실제 Supabase로 인증 시나리오 13개 통과. 미로그인 접근은 로그인 화면으로 되돌려보냄.", ops:[{t:"사번 → 가상 이메일로 Auth 위임 · 비밀번호 검증",st:"pass"},{t:"토큰을 httpOnly 쿠키로 발급 · 권한(User/Admin) 판정",st:"pass"},{t:"홈에서 '생성' 탭 / '취합' 탭으로 화면 분기",st:"pass"}], next:["s2","s3","s4"] },

              merged.ops = (Array.isArray(merged.ops) ? merged.ops : (dn && Array.isArray(dn.ops) ? dn.ops : [])).map(normalizeOp);

            return base;

            if(typeof s.name === "string") n.name = s.name;
            if(typeof s.note === "string") n.note = s.note;

  function drawEdges(){
    var old = svg.querySelectorAll("path.edge");
    for(var k = 0; k < old.length; k++) old[k].remove();
    var rect = flow.getBoundingClientRect();
    if(rect.width === 0) return;

    refs.forEach(function(r){
      (r.s.next || []).forEach(function(tid){

        var a = r.box.getBoundingClientRect();
        var b = t.box.getBoundingClientRect();
        var x1 = a.right - rect.left;
        var y1 = a.top + a.height / 2 - rect.top;
        var x2 = b.left - rect.left - 4;
        var y2 = b.top + b.height / 2 - rect.top;
        var dx = Math.max(20, Math.min(60, (x2 - x1) * 0.45));

        p.setAttribute("class", "edge");

  function computeLayers(){
    var nodes = state.nodes;
    var byId = {};
    nodes.forEach(function(n){ byId[n.id] = n; });
    var indeg = {};
    nodes.forEach(function(n){ indeg[n.id] = 0; });
    nodes.forEach(function(n){
      (n.next || []).forEach(function(t){ if(indeg[t] !== undefined) indeg[t]++; });
    });
    var layer = {};
    var queue = [];
    nodes.forEach(function(n){ if(indeg[n.id] === 0){ queue.push(n.id); layer[n.id] = 0; } });
    var indegWork = Object.assign({}, indeg);
    while(queue.length){
      var id = queue.shift();
      ((byId[id] || {}).next || []).forEach(function(t){
        if(byId[t] === undefined) return;
        var cand = (layer[id] || 0) + 1;
        if(layer[t] === undefined || cand > layer[t]) layer[t] = cand;
        indegWork[t]--;
        if(indegWork[t] === 0) queue.push(t);
      });
    }
    nodes.forEach(function(n){ if(layer[n.id] === undefined) layer[n.id] = 0; });
    var maxL = 0;
    nodes.forEach(function(n){ if(layer[n.id] > maxL) maxL = layer[n.id]; });
    var layers = [];
    for(var l = 0; l <= maxL; l++){
      layers.push(nodes.filter(function(n){ return layer[n.id] === l; }));
    }
    return layers;
  }

    var snapshot = state.nodes.map(function(n){
      return { id:n.id, name:n.name, tip:n.tip, state:n.state, note:n.note,
        ops:(n.ops || []).map(function(o){ return { t:o.t, st:o.st }; }), next:(n.next || []).slice() };
    });
    // 내보내는 파일은 빈 그릇으로 — 상태와 구조는 DEFAULTS 블록에 심는다
    flow.innerHTML = "";
    if(chip) chip.innerHTML = "";
    var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    var literal = JSON.stringify(snapshot, null, 1);
    html = html.replace(
      /\/\*EDITMODE-BEGIN\*\/[\s\S]*?\/\*EDITMODE-END\*\//,
      "/*EDITMODE-BEGIN*/ " + literal + " /*EDITMODE-END*/"
    );
    buildFlow();
    render();
    var blob = new Blob([html], { type:"text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    var d = new Date();
    var stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    link.href = url;
    link.download = "유저플로우-점검-현황-" + stamp + ".html";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    var original = btn.textContent;
    btn.textContent = "저장됨 — 공유하세요";
    setTimeout(function(){ btn.textContent = original; }, 1800);
  });

  render();
})();
</script>
</body>
</html>
