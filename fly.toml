# Fly.io 배포 설정.
#
# 도쿄(nrt)를 쓰는 이유: Supabase 프로젝트가 서울(ap-northeast-2)이고, 요청 한 번에
# Supabase REST를 여러 번 오간다(인증 확인·기록·Storage). 가장 가까운 Fly 리전이다.
#
# **머신 1대로 못 박는다.** 세션·잡이 프로세스 메모리라 인스턴스가 둘이면 요청이 다른
# 인스턴스로 가면서 세션을 잃는다. auto_stop도 끈다 — 머신이 잠들면 진행 중이던
# 취합 잡과 업로드 세션이 통째로 사라진다.

app = "chwihap"
primary_region = "nrt"

[build]

[env]
  PORT = "8080"
  COOKIE_SECURE = "1"        # HTTPS로 서비스하므로 쿠키에 Secure를 붙인다
  AI_CONCURRENCY = "6"       # 2단계 재검증 동시 호출 수(실측 근거는 HANDOFF §4)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1   # 세션이 메모리에 있는 한 늘리면 안 된다

  [http_service.concurrency]
    type = "requests"
    # 2단계 AI 재검증이 파일당 20초대라 요청이 오래 머문다. 넉넉히 받되
    # 한 머신이 감당할 만큼만 둔다
    soft_limit = 40
    hard_limit = 60

[[vm]]
  # 30개 파일 취합 실측에서 최대 RSS 378MB였다(HANDOFF §4). 여유를 둔다
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# 업로드 상한이 파일당 50MB·합계 500MB다. Fly 프록시 기본 바디 상한은 이보다 크지만,
# 느린 회선에서 큰 업로드가 끊기지 않도록 keep-alive를 늘려 두었다(Dockerfile CMD).
