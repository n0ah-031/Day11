<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>KDHCMoa - 작업 이력</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<!-- 저장된 테마를 페인트 전에 적용 (전환 시 흰 화면 깜빡임 방지) -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var dark = saved ? saved === 'dark'
                     : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>

<script id="tailwind-config">
  // 색상은 채널값 CSS 변수를 참조한다. rgb(var(--x) / <alpha-value>) 형태여야
  // bg-primary/20 같은 투명도 유틸리티가 라이트·다크 양쪽에서 동작한다.
  const token = (name) => `rgb(var(${name}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": token("--primary"),
          "primary-container": token("--primary-container"),
          "on-primary": token("--on-primary"),
          "secondary": token("--secondary"),
          "secondary-container": token("--secondary-container"),
          "tertiary": token("--tertiary"),
          "tertiary-container": token("--tertiary-container"),
          "background": token("--background"),
          "surface": token("--surface"),
          "surface-variant": token("--surface-variant"),
          "surface-container": token("--surface-container"),
          "surface-container-low": token("--surface-container-low"),
          "surface-container-high": token("--surface-container-high"),
          "surface-container-highest": token("--surface-container-highest"),
          "on-surface": token("--on-surface"),
          "on-surface-variant": token("--on-surface-variant"),
          "outline": token("--outline"),
          "outline-variant": token("--outline-variant"),
          "error": token("--error")
        },
        borderRadius: {
          "DEFAULT": "var(--radius)",
          "lg": "var(--radius-lg)",
          "xl": "var(--radius-xl)",
          "full": "9999px"
        },
        spacing: {
          "lg": "40px", "gutter": "24px", "base": "4px", "md": "24px",
          "container-max": "1200px", "xl": "64px", "sm": "16px", "xs": "8px"
        },
        fontFamily: {
          "headline-xl": ["Noto Sans"], "headline-lg": ["Noto Sans"], "headline-md": ["Noto Sans"],
          "body-lg": ["Noto Sans"], "body-md": ["Noto Sans"], "body-sm": ["Noto Sans"],
          "label-md": ["Noto Sans"], "label-sm": ["Noto Sans"]
        },
        fontSize: {
          "headline-xl": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
          "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
          "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
          "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
          "label-md": ["14px", {"lineHeight": "16px", "fontWeight": "500"}],
          "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
        },
        boxShadow: {
          "soft": "var(--shadow-soft)",
          "soft-hover": "var(--shadow-soft-hover)"
        }
      }
    }
  };
</script>

<style>
  /* 라이트 — stitch_ (1): Soft Lavender / 둥근 코너 / 부드러운 그림자 */
  :root {
    --primary: 138 132 255;
    --primary-container: 230 228 255;
    --on-primary: 255 255 255;
    --secondary: 127 199 189;
    --secondary-container: 214 242 238;
    --tertiary: 255 179 138;
    --tertiary-container: 255 234 214;
    --background: 253 251 255;
    --surface: 255 255 255;
    --surface-variant: 245 243 255;
    --surface-container: 245 243 255;
    --surface-container-low: 250 249 255;
    --surface-container-high: 240 238 255;
    --surface-container-highest: 235 232 255;
    --on-surface: 45 45 58;
    --on-surface-variant: 91 91 110;
    --outline: 209 209 224;
    --outline-variant: 235 235 245;
    --error: 255 138 138;

    --radius: 1rem;
    --radius-lg: 1.25rem;
    --radius-xl: 2rem;
    --shadow-soft: 0 8px 30px rgb(138 132 255 / 0.08);
    --shadow-soft-hover: 0 12px 40px rgb(138 132 255 / 0.12);
    --glass-bg: 255 255 255 / 0.7;
    --glass-border: 255 255 255 / 0.8;
    --blob-opacity: 0.05;
  }

  /* 다크 — stitch_ (2): Vibrant Indigo / 각진 코너 / 글로우 */
  .dark {
    --primary: 79 70 229;
    --primary-container: 55 48 163;
    --on-primary: 255 255 255;
    --secondary: 129 140 248;
    --secondary-container: 49 46 129;
    --tertiary: 192 132 252;
    --tertiary-container: 88 28 135;
    --background: 2 6 23;
    --surface: 15 23 42;
    --surface-variant: 30 41 59;
    --surface-container: 30 41 59;
    --surface-container-low: 15 23 42;
    --surface-container-high: 51 65 85;
    --surface-container-highest: 71 85 105;
    --on-surface: 241 245 249;
    --on-surface-variant: 148 163 184;
    --outline: 51 65 85;
    --outline-variant: 30 41 59;
    --error: 239 68 68;

    --radius: 0.375rem;
    --radius-lg: 0.75rem;
    --radius-xl: 1rem;
    --shadow-soft: 0 0 15px rgb(79 70 229 / 0.1);
    --shadow-soft-hover: 0 0 20px rgb(79 70 229 / 0.2);
    --glass-bg: 15 23 42 / 0.6;
    --glass-border: 51 65 85 / 0.5;
    --blob-opacity: 0.12;
  }

  body {
    font-family: 'Noto Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .glass-card {
    background: rgb(var(--glass-bg));
    backdrop-filter: blur(12px);
    border: 1px solid rgb(var(--glass-border));
  }
  /* 다크 모드에서만 입력창에 글로우를 얹는다 (라이트는 soft shadow 유지) */
  .dark .glow-border { box-shadow: 0 0 15px rgb(var(--primary) / 0.1); }
  .dark .glow-border:focus-within {
    border-color: rgb(var(--primary) / 0.8);
    box-shadow: 0 0 20px rgb(var(--primary) / 0.2);
  }
  .blob { opacity: var(--blob-opacity); }
</style>
</head>

<body class="bg-background text-on-surface">
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant">
<div class="flex justify-between items-center h-16 px-gutter max-w-container-max mx-auto">
<a class="text-headline-lg font-headline-lg font-bold text-primary tracking-tight" href="index.html">KDHCMoa</a>
<div class="flex items-center gap-4">
<nav class="hidden md:flex items-center gap-8">
<a class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md" href="create.html">양식 생성</a>
<a class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md" href="aggregate.html">엑셀 취합</a>
<a class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md" href="hwpx.html">한글 병합</a>
<a id="nav-admin" href="admin.html" class="hidden px-3 py-1 rounded-full bg-primary/10 border border-primary/30 text-label-sm font-label-sm text-primary hover:bg-primary/20 transition-colors">관리자 콘솔</a>
<span id="nav-user" class="hidden text-body-sm font-body-sm text-on-surface-variant"></span>
<button id="nav-logout" class="text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md">로그아웃</button>
</nav>
<button id="theme-toggle" type="button" aria-label="라이트/다크 모드 전환"
        class="flex items-center justify-center w-10 h-10 rounded-full border border-outline-variant text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
</button>
</div>
</div>
</header>

<main class="pt-24 pb-xl px-gutter max-w-container-max mx-auto">
<h1 class="text-headline-xl font-headline-xl font-bold">작업 이력</h1>
<p class="mt-2 text-body-md font-body-md text-on-surface-variant">지난 취합 작업과 결과 파일을 다시 내려받을 수 있습니다.</p>

<!-- 검색 + 유형 필터 (design.md 화면 9) -->
<div class="mt-md flex flex-wrap items-center gap-3">
<div class="flex items-center gap-2 flex-1 min-w-64 rounded-xl bg-surface border border-outline-variant px-4 py-3 glow-border">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
<input id="q" type="search" placeholder="작업명 또는 파일명으로 검색"
       class="flex-1 bg-transparent border-0 p-0 text-body-md text-on-surface placeholder:text-on-surface-variant focus:ring-0">
</div>
<div id="type-filter" role="tablist" class="flex gap-1 p-1 rounded-xl bg-surface-variant/60"></div>
</div>

<div id="empty" class="hidden mt-lg rounded-xl glass-card shadow-soft p-10 text-center">
<span class="material-symbols-outlined text-5xl text-on-surface-variant">history</span>
<p class="mt-3 text-body-md font-body-md text-on-surface-variant" id="empty-text"></p>
<a href="aggregate.html"
   class="inline-block mt-5 px-6 py-3 rounded-xl bg-primary text-on-primary text-label-md font-label-md font-semibold hover:opacity-90 transition-all">
취합 시작하기
</a>
</div>

<div id="error" class="hidden mt-md rounded-xl border border-error/40 bg-error/10 px-5 py-4 text-body-sm font-body-sm text-on-surface"></div>
<div id="list" class="mt-md flex flex-col gap-4"></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // created_at은 UTC(timestamptz)로 온다. 그대로 자르면 프로젝트 이름에 박힌
  // 로컬 시각과 어긋나 보이므로 보는 사람의 시간대로 변환한다.
  const when = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return String(iso || '').slice(0, 16).replace('T', ' ');
    const p2 = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} `
         + `${p2(d.getHours())}:${p2(d.getMinutes())}`;
  };

  let state = { type: '', q: '', projects: [] };

  // 테마 토글 — 다른 화면과 동일
  function paintTheme() {
    const dark = document.documentElement.classList.contains('dark');
    $('theme-icon').textContent = dark ? 'light_mode' : 'dark_mode';
  }
  $('theme-toggle').addEventListener('click', () => {
    const dark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    paintTheme();
  });
  paintTheme();

  async function api(path) {
    const res = await fetch(path);
    if (res.status === 401) { location.href = '/login.html'; throw new Error('로그인이 필요합니다.'); }
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error((body && body.detail) || `요청에 실패했습니다. (HTTP ${res.status})`);
    return body;
  }

  const TYPES = [
    { key: '', label: '전체' },
    { key: 'excel', label: '엑셀' },
    { key: 'hwpx', label: '한글' }
  ];

  function renderFilter() {
    $('type-filter').innerHTML = TYPES.map((t) => {
      const on = state.type === t.key;
      return `<button data-type="${t.key}" role="tab" aria-selected="${on}"
        class="px-5 py-2 rounded-lg text-label-md font-label-md font-semibold transition-all ${
          on ? 'bg-surface text-primary shadow-soft' : 'text-on-surface-variant hover:text-primary'}">${t.label}</button>`;
    }).join('');
    $('type-filter').querySelectorAll('button').forEach((b) => {
      b.addEventListener('click', () => { state.type = b.dataset.type; renderFilter(); load(); });
    });
  }

  const STATUS_STYLE = {
    done: ['완료', 'bg-primary/10 text-primary border-primary/30'],
    running: ['진행 중', 'bg-tertiary/15 text-on-surface border-tertiary/40'],
    queued: ['대기', 'bg-surface-variant text-on-surface-variant border-outline-variant'],
    failed: ['실패', 'bg-error/10 text-error border-error/40']
  };

  function jobRow(projectId, job) {
    const [label, cls] = STATUS_STYLE[job.status] || [job.status, 'bg-surface-variant text-on-surface-variant border-outline-variant'];
    const canDownload = job.status === 'done' && job.result_url;
    return `<div class="flex flex-wrap items-center gap-3 rounded-lg bg-surface-variant/40 px-4 py-3">
      <span class="px-2.5 py-1 rounded-full border text-label-sm font-label-sm ${cls}">${esc(label)}</span>
      <span class="text-body-sm font-body-sm text-on-surface">모드 ${esc(job.mode || '-')}</span>
      <span class="text-body-sm font-body-sm text-on-surface-variant">${esc(when(job.created_at))}</span>
      ${job.error_message ? `<span class="text-body-sm font-body-sm text-error">${esc(job.error_message)}</span>` : ''}
      <span class="flex-1"></span>
      ${canDownload
        ? `<a href="/api/history/${encodeURIComponent(projectId)}/download/${encodeURIComponent(job.id)}"
             class="px-4 py-2 rounded-lg bg-primary text-on-primary text-label-md font-label-md font-semibold hover:opacity-90 transition-all">결과 다시 받기</a>`
        : `<span class="text-body-sm font-body-sm text-on-surface-variant">받을 결과 없음</span>`}
    </div>`;
  }

  function render() {
    const rows = state.projects;
    const filtering = state.q || state.type;
    $('empty').classList.toggle('hidden', rows.length > 0);
    $('empty-text').textContent = filtering
      ? '조건에 맞는 작업이 없습니다.'
      : '아직 취합 작업 이력이 없습니다.';
    $('list').innerHTML = rows.map((p) => {
      const files = p.file_names.length
        ? p.file_names.map((n) => `<span class="px-2.5 py-1 rounded-full bg-surface-variant text-label-sm font-label-sm text-on-surface-variant">${esc(n)}</span>`).join('')
        : '<span class="text-body-sm font-body-sm text-on-surface-variant">업로드된 파일이 없습니다.</span>';
      const jobs = p.jobs.length
        ? p.jobs.map((j) => jobRow(p.id, j)).join('')
        : '<p class="text-body-sm font-body-sm text-on-surface-variant">취합을 실행하지 않은 작업입니다.</p>';
      return `<section class="rounded-xl glass-card shadow-soft p-6 flex flex-col gap-4">
        <div class="flex flex-wrap items-center gap-3">
          <span class="material-symbols-outlined text-primary">table_view</span>
          <h2 class="text-headline-md font-headline-md font-semibold text-on-surface">${esc(p.name)}</h2>
          <span class="px-2.5 py-1 rounded-full bg-surface-variant text-label-sm font-label-sm text-on-surface-variant">파일 ${p.file_count}개</span>
          <span class="flex-1"></span>
          <span class="text-body-sm font-body-sm text-on-surface-variant">${esc(when(p.created_at))}</span>
        </div>
        <div class="flex flex-wrap gap-2">${files}</div>
        <div class="flex flex-col gap-2">${jobs}</div>
      </section>`;
    }).join('');
  }

  async function load() {
    $('error').classList.add('hidden');
    try {
      const params = new URLSearchParams();
      if (state.q) params.set('q', state.q);
      if (state.type) params.set('type', state.type);
      const data = await api('/api/history?' + params.toString());
      state.projects = data.projects || [];
      render();
    } catch (e) {
      $('error').textContent = e.message;
      $('error').classList.remove('hidden');
    }
  }

  // 입력이 멈춘 뒤에 조회한다 (타이핑마다 요청하지 않는다)
  let timer = null;
  $('q').addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = $('q').value.trim(); load(); }, 250);
  });

  $('nav-logout').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/login.html';
  });

  (async function start() {
    const res = await fetch('/api/auth/me');
    if (res.status === 401) { location.href = '/login.html'; return; }
    if (res.ok) {
      const { profile, auth_enabled } = await res.json();
      if (auth_enabled) {
        $('nav-user').textContent = profile.employee_no;
        $('nav-user').classList.remove('hidden');
        if (profile.role === 'admin') $('nav-admin').classList.remove('hidden');
      }
    }
    renderFilter();
    load();
  })();
</script>
</body>
</html>
